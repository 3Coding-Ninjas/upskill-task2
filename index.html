<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
<body>
    <div class="container">
  <form action="/register" method="post">
  <h1>Student Registration Form</h1>
<table>
    <tr>
        <td>
            Name :
        </td>
        <td>
            <input type="text"placeholder=" Full name" name="">
        </td>
    </tr>
    <tr>
        <td>
            Password :
        </td>
        <td>
        <input type="password" placeholder= "password" name="">
        </td>
        </tr>
        <tr>
            <td>
                Gender :
            </td>
            <td>
            <input type= "radio" name= "Gender"> male
            <input type= "radio" name= "Gender"> female
            </td>
        </tr>
        <tr>
            <td>
                Email :
            </td>
        </tr>
        <td>
        <input type= "mail" placeholder="Enter Email" name="">
        </td>
    </tr>
    <tr>
        <td>
            Country :
        </td>
    </tr>
    <td>
        <select>
            <option>Nigeria</option>
             <option>Ghana</option>
              <option>Kenya</option>
               <option>South Africa</option>
        </select>
    </td>
    <tr>
        <td>
            About yourself :
        </td>
    </tr>
    <td>
    <textarea placeholder="Tell us a little about yourself..."></textarea>
</td>
    <tr>
        <td>
            Phone No :
        </td>
        <td>
            <select>
                <option>+234</option>
                 <option>+243</option>
                  <option>+432</option>
                   <option>+443</option>
            </select>
            <input type="Phone"placeholder="+23480*********" name="" 
        </td>
    </tr>
    <tr>
        <td>
Terms and conditions :
        </td>
    </tr>
<td>
    <input type="checkbox">I agree to the terms.
</td>
    <tr>
        <td>
            <button type="submit">Register now</button> 
        </td>
    </tr>
</table>
  </form>
  </div>
</body>
</html>
